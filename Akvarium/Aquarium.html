<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аквариум</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#03070b;}
  body{background:radial-gradient(ellipse at 50% 42%, #10283a 0%, #071420 38%, #02060a 75%, #010203 100%);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;}
  canvas{display:block;outline:none;cursor:grab;touch-action:none;}
  canvas:active{cursor:grabbing;}
  canvas.fishy{cursor:pointer;}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,3,6,.62) 100%);}
  #grain{position:fixed;inset:-60px;pointer-events:none;z-index:1;opacity:.07;animation:grain 1s steps(6) infinite;}
  @keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-23px,11px)}33%{transform:translate(17px,-29px)}50%{transform:translate(-9px,31px)}67%{transform:translate(29px,7px)}83%{transform:translate(-31px,-17px)}100%{transform:translate(0,0)}}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;font-size:12.5px;line-height:1.5;letter-spacing:.03em;
    color:rgba(205,238,255,.62);text-shadow:0 1px 6px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap;transition:opacity 2s ease;opacity:0;}
  #hint.on{opacity:1}
  #fps{position:fixed;left:12px;bottom:10px;z-index:2;font:11px/1 ui-monospace,Menlo,Consolas,monospace;color:rgba(190,235,255,.4);pointer-events:none;}
  #tip{position:fixed;z-index:4;pointer-events:none;padding:5px 9px 6px;border-radius:8px;background:rgba(4,20,30,.62);
    border:1px solid rgba(140,220,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#e2f6ff;font-size:12.5px;
    white-space:nowrap;opacity:0;transition:opacity .25s;transform:translate(14px,-50%);}
  #tip i{display:block;font-size:10.5px;color:rgba(170,220,240,.7);margin-top:1px}
  #tip.on{opacity:1}
  #follow{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3;padding:6px 14px;border-radius:20px;background:rgba(4,20,30,.55);
    border:1px solid rgba(140,220,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#dff5ff;font-size:12.5px;
    opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;}
  #follow.on{opacity:1}
  #panel{position:fixed;top:14px;right:14px;width:236px;z-index:3;padding:12px 14px 12px;color:#d6f3ff;font-size:12.5px;line-height:1.3;
    background:linear-gradient(160deg,rgba(18,52,70,.55),rgba(4,18,28,.62));backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
    border:1px solid rgba(150,225,255,.2);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
    transition:opacity .4s, transform .4s;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:thin;}
  #panel.hid{opacity:0;transform:translateX(30px);pointer-events:none;}
  #panel h3{margin:0 0 9px;font:600 13px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:#bfeaff;display:flex;justify-content:space-between;align-items:center}
  #panel h3 span{font:400 10.5px/1 inherit;letter-spacing:.02em;text-transform:none;color:rgba(190,230,250,.55)}
  #panel .sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(170,220,240,.5);margin:11px 0 5px}
  .seg{display:flex;gap:5px}
  .seg button,.btns button{flex:1;padding:6px 0;background:rgba(95,211,255,.1);color:inherit;border:1px solid rgba(140,220,255,.25);border-radius:8px;
    cursor:pointer;font:inherit;transition:background .2s,border-color .2s}
  .seg button:hover,.btns button:hover{background:rgba(95,211,255,.25)}
  .seg button.act{background:rgba(95,211,255,.34);border-color:rgba(170,235,255,.6);box-shadow:0 0 12px rgba(95,211,255,.25)}
  .seg button b{font-weight:400;opacity:.45;font-size:10px;margin-left:3px}
  .row{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:6px;margin:5px 0}
  .row output{text-align:right;font-variant-numeric:tabular-nums;color:rgba(200,235,250,.6);font-size:11px}
  input[type=range]{width:100%;margin:0;accent-color:#5fd3ff;height:16px}
  .tog{display:flex;justify-content:space-between;align-items:center;margin:4px 0;cursor:pointer}
  .tog input{appearance:none;-webkit-appearance:none;width:30px;height:16px;border-radius:9px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
  .tog input::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#cfefff;transition:transform .2s}
  .tog input:checked{background:#2fa8d8}
  .tog input:checked::after{transform:translateX(14px)}
  .tog small{opacity:.45;font-size:10px;margin-left:4px}
  .btns{display:flex;gap:5px;margin-top:6px}
  #keys{margin-top:9px;font-size:10.5px;line-height:1.55;color:rgba(180,225,245,.5)}
  #keys kbd{font:10px ui-monospace,monospace;padding:0 4px;border:1px solid rgba(160,220,255,.25);border-radius:3px;color:rgba(210,240,255,.75)}
  #open{position:fixed;top:14px;right:14px;z-index:3;width:34px;height:34px;border-radius:10px;border:1px solid rgba(150,225,255,.22);
    background:rgba(4,20,30,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#cfefff;font-size:16px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
  #open.on{opacity:.75;pointer-events:auto}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .5s}
  #boot{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#02080c;color:#9fe6ff;
    font-size:16px;letter-spacing:.14em;text-align:center;padding:20px;transition:opacity 1.4s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .b{width:10px;height:10px;border:1.5px solid rgba(160,230,255,.7);border-radius:50%;display:inline-block;margin:0 5px;animation:bub 1.6s ease-in infinite}
  #boot .b:nth-child(2){animation-delay:.3s;width:7px;height:7px}#boot .b:nth-child(3){animation-delay:.6s;width:12px;height:12px}
  @keyframes bub{0%{transform:translateY(14px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
  #boot.err{letter-spacing:.03em;color:#ffd9c9;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div id="boot"><div><span class="b"></span><span class="b"></span><span class="b"></span></div><div id="bootmsg">Наполняем аквариум…</div></div>
<script>
  // shown if the three.js CDN is unreachable or WebGL fails
  window.__aqFail = function (why) {
    var b = document.getElementById('boot'); if (!b || window.__ok) return;
    b.className = 'err';
    b.innerHTML = '<div>Не удалось запустить аквариум.</div><div style="opacity:.75;font-size:13px">' + (why || 'Библиотека Three.js не загрузилась с CDN — проверьте подключение к интернету и обновите страницу.') + '</div>';
  };
  setTimeout(function () { if (!window.__ok) window.__aqFail(); }, 15000);
</script>
<div id="vignette"></div>
<canvas id="grainSrc" width="1" height="1" style="display:none"></canvas>
<div id="grain"></div>
<div id="hint">клик — корм · зажми — сыпать · двойной клик по рыбе — следить · правый клик — стук по стеклу · <b style="font-weight:600">H</b> — панель</div>
<div id="fps"></div>
<div id="tip"></div>
<div id="follow"></div>
<div id="flash"></div>
<button id="open" title="Показать панель (H)">☰</button>
<div id="panel"></div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" onerror="window.__aqFail()">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ------------------------------------------------------------------ basics
const W = 16, D = 8, HT = 9.0, HS = 8.4;            // tank width, depth, glass height, water surface
const BMIN = new THREE.Vector3(-W/2, -0.5, -D/2), BMAX = new THREE.Vector3(W/2, HS, D/2);
const SUN = new THREE.Vector3(0.28, 1, 0.18).normalize();

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) { window.__aqFail('Браузер не поддерживает WebGL (или он отключён).'); throw e; }
const MAXPR = Math.min(window.devicePixelRatio || 1, 1.75);
let pixelRatio = MAXPR;
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.getElementById('vignette'));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 200);
const CAM_HOME = new THREE.Vector3(0, 5.0, 22.5), TGT_HOME = new THREE.Vector3(0, 4.0, 0);
camera.position.set(0, 10.5, 40);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT_HOME);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.rotateSpeed = 0.5; controls.zoomSpeed = 0.7;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
const LIM = { tight: { minD: 11, maxD: 30, minP: Math.PI * 0.36, maxP: Math.PI * 0.56, az: Math.PI * 0.36 },
              free:  { minD: 5, maxD: 42, minP: 0.12, maxP: Math.PI * 0.62, az: Infinity } };
function applyLimits(l) {
  controls.minDistance = l.minD; controls.maxDistance = l.maxD; controls.minPolarAngle = l.minP; controls.maxPolarAngle = l.maxP;
  controls.minAzimuthAngle = -l.az; controls.maxAzimuthAngle = l.az;
}
applyLimits(LIM.free);  // intro dolly starts outside the tight range
controls.enabled = false;
controls.update();

const hemi = new THREE.HemisphereLight(0x9fe4ff, 0x4a3a28, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.copy(SUN).multiplyScalar(20); scene.add(sun);
const fill = new THREE.DirectionalLight(0x4fa8ff, 0.5);
fill.position.set(-6, 3, 10); scene.add(fill);
const torch = new THREE.PointLight(0xc8f0ff, 0, 7.5, 1.4); torch.position.set(0, 4, 2); scene.add(torch);

// shared uniforms (same objects referenced by every material)
const U = {
  uTime: { value: 0 }, uRT: { value: 0 },
  uBoxMin: { value: BMIN }, uBoxMax: { value: BMAX },
  uDeep: { value: new THREE.Color(0x02223a) }, uShallow: { value: new THREE.Color(0x1f8fb0) },
  uSunDir: { value: SUN }, uCurrent: { value: new THREE.Vector2(1, 0) }, uDrift: { value: new THREE.Vector2(0, 0) }, uPR: { value: pixelRatio },
  uNight: { value: 0 }, uWarm: { value: 0 }, uTurb: { value: 1 }, uCaus: { value: 1 }, uCausCol: { value: new THREE.Color(0.85, 1.0, 1.0) },
  uAir: { value: 1 }, uGlowK: { value: 1 },
  uRip: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, 0, -100, 0)) },
  uKnock: { value: new THREE.Vector4(0, 0, 0, -100) },
};

// ------------------------------------------------------------------ noise (JS)
function hash3(x, y, z) { let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  return L(L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v),
           L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w) * 2 - 1;
}
function fbm(x, y, z, o = 4) { let a = 0, s = 0.5, f = 1; for (let i = 0; i < o; i++) { a += s * vnoise(x * f, y * f, z * f); f *= 2.03; s *= 0.5; } return a; }
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const clamp = THREE.MathUtils.clamp;

// ------------------------------------------------------------------ shared GLSL
const WATER_GLSL = /* glsl */`
uniform float uTime; uniform vec3 uBoxMin; uniform vec3 uBoxMax; uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uSunDir; uniform vec2 uCurrent;
uniform float uNight; uniform float uWarm; uniform float uTurb; uniform float uCaus; uniform vec3 uCausCol; uniform float uGlowK;
vec3 waterColor(float y){ float k = clamp(y / uBoxMax.y, 0.0, 1.0); return mix(uDeep, uShallow, k * k * 0.85 + k * 0.15); }
float waterPath(vec3 p){
  vec3 ro = cameraPosition; vec3 d = p - ro;
  vec3 dd = d + vec3(1e-5);
  vec3 t0 = (uBoxMin - ro) / dd, t1 = (uBoxMax - ro) / dd;
  vec3 tmin = min(t0, t1);
  float tn = clamp(max(max(tmin.x, tmin.y), tmin.z), 0.0, 1.0);
  return length(d) * (1.0 - tn);
}
vec3 waterApply(vec3 col, vec3 p){
  float path = waterPath(p) * uTurb;
  col *= exp(-path * vec3(0.10, 0.035, 0.022));
  col *= mix(0.55, 1.0, clamp(p.y / uBoxMax.y, 0.0, 1.0));
  float f = 1.0 - exp(-path * 0.085);
  return mix(col, waterColor(p.y), f);
}
vec2 aqH22(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float aqVoro(vec2 x, float t){
  vec2 n = floor(x), f = fract(x); float m1 = 8.0, m2 = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)); vec2 o = aqH22(n + g); o = 0.5 + 0.42 * sin(t + 6.2831 * o);
    vec2 r = g + o - f; float d = dot(r, r);
    if (d < m1) { m2 = m1; m1 = d; } else if (d < m2) { m2 = d; }
  }
  return sqrt(m2) - sqrt(m1);
}
float causticT(vec2 uv, float time){
  uv *= 2.2;
  uv += 0.12 * sin(uv.yx * 1.7 + time * 0.8);
  float e1 = aqVoro(uv, time), e2 = aqVoro(uv * 1.35 + 7.3, time * 1.2);
  float c1 = pow(1.0 - clamp(e1 * 2.4, 0.0, 1.0), 5.0), c2 = pow(1.0 - clamp(e2 * 2.6, 0.0, 1.0), 6.0);
  return c1 * 0.8 + c2 * 0.5 + c1 * c2 * 1.2;
}
float caustics(vec3 p, vec3 n){
  vec2 uv = p.xz + uSunDir.xz / uSunDir.y * (uBoxMax.y - p.y);
  float c = causticT(uv * 0.3, uTime * 0.7);
  float up = clamp(n.y * 0.8 + 0.2, 0.0, 1.0);
  return c * up * mix(0.45, 1.0, clamp(p.y / uBoxMax.y, 0.0, 1.0)) * uCaus;
}
float bHash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float bNoise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(bHash(i), bHash(i + vec3(1,0,0)), f.x), mix(bHash(i + vec3(0,1,0)), bHash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(bHash(i + vec3(0,0,1)), bHash(i + vec3(1,0,1)), f.x), mix(bHash(i + vec3(0,1,1)), bHash(i + vec3(1,1,1)), f.x), f.y), f.z); }
`;

// patch a MeshStandardMaterial: caustics + water volume + optional bump + custom vertex/colour code
function patch(mat, o = {}) {
  mat.onBeforeCompile = (sh) => {
    for (const k in U) sh.uniforms[k] = U[k];
    if (o.uniforms) Object.assign(sh.uniforms, o.uniforms);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime; uniform vec2 uCurrent; uniform float uNight;\nvarying vec3 vWPos; varying vec3 vWNrm;\n' + (o.vHead || ''))
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + (o.vert || ''))
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vec4 wpp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wpp = instanceMatrix * wpp;
        #endif
        wpp = modelMatrix * wpp; vWPos = wpp.xyz;
        vWNrm = normalize((vec4(transformedNormal, 0.0) * viewMatrix).xyz);`);
    let fs = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos; varying vec3 vWNrm;\n' + WATER_GLSL + (o.fHead || ''))
      .replace('#include <color_fragment>', o.color ? o.color : '#include <color_fragment>')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += diffuseColor.rgb * caustics(vWPos, normalize(vWNrm)) * ${(o.caustic ?? 1.0).toFixed(3)} * uCausCol;
        ${o.emis || ''}`)
      .replace('#include <fog_fragment>', 'gl_FragColor.rgb = waterApply(gl_FragColor.rgb, vWPos);');
    if (o.near) fs = fs.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n if (length(vViewPosition) < ' + o.near.toFixed(2) + ') discard;');
    if (o.bump) fs = fs.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      { // procedural bump via screen-space derivatives (no textures)
        vec3 bp = vWPos * ${o.bumpFreq || '5.0'};
        float bh = bNoise(bp) * 0.65 + bNoise(bp * 2.9 + 3.1) * 0.35;
        float k = ${o.bump.toFixed(3)} * smoothstep(34.0, 12.0, length(vViewPosition));
        vec3 sX = dFdx(-vViewPosition), sY = dFdy(-vViewPosition);
        float dBx = dFdx(bh), dBy = dFdy(bh);
        vec3 R1 = cross(sY, normal), R2 = cross(normal, sX);
        float det = dot(sX, R1) * faceDirection;
        vec3 grad = sign(det) * (dBx * R1 + dBy * R2);
        normal = normalize(abs(det) * normal - k * grad);
      }`);
    sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => 'aq_' + (o.key || 'std');
  return mat;
}

// ------------------------------------------------------------------ tank shell: backdrop walls, stand, frame, glass
const lampMat = new THREE.MeshBasicMaterial({ color: 0xdff6ff });
const glassMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uRT: U.uRT, uKnock: U.uKnock },
  vertexShader: `varying vec3 vN; varying vec3 vP; varying vec2 vUv; void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.); vP=w.xyz; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uRT; uniform vec4 uKnock; varying vec3 vN; varying vec3 vP; varying vec2 vUv;
    void main(){
      vec3 v = normalize(cameraPosition - vP);
      float f = pow(1.0 - abs(dot(v, vN)), 4.0);
      float streak = smoothstep(0.0, 0.08, abs(fract((vUv.x + vUv.y * 0.6) * 1.3) - 0.5) - 0.38) ;
      float edge = smoothstep(0.985, 1.0, max(abs(vUv.x*2.-1.), abs(vUv.y*2.-1.)));
      vec3 c = vec3(0.55, 0.8, 0.9) * (0.02 + 0.25 * f + 0.025 * streak) + vec3(0.25, 0.45, 0.45) * edge;
      float age = uRT - uKnock.w;
      if (age < 2.5) {               // knock: expanding rings on the glass
        float d = distance(vP, uKnock.xyz);
        float r1 = abs(d - age * 4.0), r2 = abs(d - age * 2.6);
        float ring = smoothstep(0.12, 0.0, r1) + 0.6 * smoothstep(0.08, 0.0, r2) + smoothstep(0.35, 0.0, d) * 1.5;
        c += vec3(0.6, 0.9, 1.0) * ring * exp(-age * 2.2) * 0.55;
      }
      gl_FragColor = vec4(c, 1.0);
    }`
});
let backdrop;
{
  const bd = new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide,
    vertexShader: `varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: WATER_GLSL + `varying vec3 vP;
      void main(){
        vec3 c = waterColor(vP.y);
        float lat = abs(vP.x) / uBoxMax.x;

// branching coral (recursive cylinders)
function branchCoral(x, y, z, scale, baseC, tipC, sd, depthMax = 4, glow = 0.35) {
  seed = sd;
  const parts = [];
  const up = new THREE.Vector3(0, 1, 0);
  function br(start, dir, len, rad, d) {
    const end = start.clone().addScaledVector(dir, len);
    const cg = new THREE.CylinderGeometry(rad * 0.72, rad, len, 7, 2, false);
    cg.translate(0, len / 2, 0);
    cg.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up, dir));
    cg.translate(start.x, start.y, start.z);
    const t0 = d / depthMax;
    finishLocal(cg, t0, (d + 1) / depthMax);
    parts.push(cg);
    if (d >= depthMax - 1) {
      const sg = new THREE.SphereGeometry(rad * 0.75, 8, 6); sg.translate(end.x, end.y, end.z);
      finishLocal(sg, 1, 1); parts.push(sg); return;
    }
    const kids = 2 + (rnd() < 0.45 ? 1 : 0);
    for (let k = 0; k < kids; k++) {
      const nd = dir.clone().add(new THREE.Vector3(rr(-0.75, 0.75), rr(0.1, 0.55), rr(-0.75, 0.75))).normalize();
      if (nd.y < 0.25) { nd.y = 0.25; nd.normalize(); }
      br(end, nd, len * rr(0.68, 0.88), rad * 0.72, d + 1);
    }
  }
  function finishLocal(g, t0, t1) {
    g.userData.t = [t0, t1];
  }
  br(new THREE.Vector3(0, 0, 0), new THREE.Vector3(rr(-0.2, 0.2), 1, rr(-0.2, 0.2)).normalize(), 0.55, 0.11, 0);
  for (const g of parts) {
    const [t0, t1] = g.userData.t;
    g.scale(scale, scale, scale); g.translate(x, y, z);
    const yMin = y, yMax = y + 2.2 * scale;
    finish(g, (P, N, c) => {
      const t = Math.min(1, Math.max(0, (P.y - yMin) / (yMax - yMin)));
      const k = t0 + (t1 - t0) * 0.5;
      c.copy(baseC).lerp(tipC, Math.pow(Math.max(k, t), 1.3));
      return glow * Math.pow(Math.max(k, t), 2.0);
    });
  }
}

// ------------------------------------------------------------------ fish geometry
function fishGeo(o) {
  const L = o.L, H = o.H, Wd = o.W, pos = [], fin = [], idx = [];
  const NS = o.L < 0.7 ? 18 : 26, NR = o.L < 0.7 ? 12 : 16;
  const prof = (s) => { let f = Math.pow(Math.max(Math.sin(Math.PI * Math.pow(s, o.pw || 0.62)), 0), 0.7); return Math.max(f, (o.ped || 0.12) * smooth(0.55, 1.0, s)); };
  for (let i = 0; i <= NS; i++) {
    const s = i / NS, z = L / 2 - s * L, f = prof(s);
    for (let j = 0; j < NR; j++) {
      const a = j / NR * Math.PI * 2;
      const cy = Math.cos(a), sx = Math.sin(a);
      const belly = cy < 0 ? (o.belly || 1.0) : 1.0;
      pos.push(sx * Wd / 2 * f, cy * H / 2 * f * belly + (o.yoff || 0) * f * H, z); fin.push(0);
    }
  }
  for (let i = 0; i < NS; i++) for (let j = 0; j < NR; j++) {
    const a = i * NR + j, b = i * NR + (j + 1) % NR, c = a + NR, d = b + NR;
    idx.push(a, c, b, b, c, d);
  }
  const grid = (nu, nv, fn, fv) => {
    const base = pos.length / 3;
    for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) { const p = fn(i / nu, j / nv); pos.push(p[0], p[1], p[2]); fin.push(fv); }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const a = base + i * (nv + 1) + j, b = a + 1, c = a + nv + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  };
  const zb = -L / 2 + 0.02 * L, ph = (o.ped || 0.12) * H / 2;
  // tail
  grid(6, 8, (u, v) => {
    const vv = v * 2 - 1, edge = 1 - (o.fork || 0.3) * (1 - Math.abs(vv)) - (o.round || 0) * (Math.abs(vv) ** 2);
    const z = zb - u * o.tail * edge, y = vv * (ph + (o.tailH / 2 - ph) * Math.pow(u, 0.8));
    return [0, y, z];
  }, 1);
  // dorsal & anal fins
  const finAlong = (s0, s1, h, sign, sweep) => grid(10, 3, (u, v) => {
    const s = s0 + (s1 - s0) * u, z = L / 2 - s * L, f = prof(s);
    const top = sign * (H / 2 * f * (sign < 0 ? (o.belly || 1) : 1)) + (o.yoff || 0) * f * H;
    const sh = Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.0)), 0.6) * (o.finShape ? o.finShape(u) : 1);
    return [0, top - sign * 0.02 * H + sign * v * h * sh, z - v * sweep * L * sh];
  }, 1);
  finAlong(o.d0, o.d1, o.dH, 1, o.dSweep || 0.15);
  if (o.aH) finAlong(o.a0, o.a1, o.aH, -1, o.aSweep || 0.12);
  // pectoral fins
  for (const sd of [-1, 1]) grid(3, 2, (u, v) => {
    const zz = L / 2 - (0.28 + u * 0.16) * L, f = prof(0.3);
    return [sd * (Wd / 2 * f * 0.9 + v * 0.05 * L), -0.05 * H - v * 0.12 * H + u * 0.02 * H, zz - v * 0.06 * L];
  }, 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aFin', new THREE.Float32BufferAttribute(fin, 1));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

const FISH_VERT = `

`;

for (let i = 0; i < 90; i++) { t += 1 / 30; U.uTime.value = t; updateSchool(chromis, 0, 1 / 30, t); updateSchool(anthias, 1, 1 / 30, t); updateSolo(clowns, 1 / 30); updateSolo(tangs, 1 / 30); updateSolo(ytang, 1 / 30); updateSolo(idols, 1 / 30); }
renderer.setAnimationLoop(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov(); applyViewOffset();
  renderer.setSize(innerWidth, innerHeight);
});
// debug / test hooks
window.__aqAPI = { skipIntro() { introT = 0.999; }, get introT() { return introT; }, K, setPreset, setToggle, setPopulation, dropFood, feedAt, knockAt, pickAt, startFollow, stopFollow, screenshot, togglePause, togglePanel, SPECIES, camera, controls, get fol() { return fol; }, get foodAlive() { return foodAlive; } };
