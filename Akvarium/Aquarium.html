  var planktonUniforms = {
    uTime: { value: 0 },
    uMap: { value: texDot },
    uSize: { value: 26.0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uColor: { value: new THREE.Color(0xcdf3f2) },
    uOpacity: { value: 0.5 },
    uTop: { value: WATER_Y }
  };

  var plankton = new THREE.Points(
    plankGeo,
    new THREE.ShaderMaterial({
      uniforms: planktonUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: [
        'uniform float uTime;',
        'uniform float uSize;',
        'uniform float uPixelRatio;',
        'uniform float uTop;',
        'attribute float aSeed;',
        'varying float vAlpha;',
        'void main() {',
        '  vec3 p = position;',
        '  float sp = 0.25 + aSeed * 0.5;',
        '  p.x += sin(uTime * sp + aSeed * 31.4) * 1.15;',
        '  p.z += cos(uTime * sp * 0.8 + aSeed * 17.7) * 0.95;',
        '  p.y = mod(p.y + uTime * (0.055 + aSeed * 0.12), uTop);',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  vAlpha = smoothstep(0.0, 2.0, p.y) * (1.0 - smoothstep(uTop - 1.5, uTop, p.y));',
        '  gl_PointSize = uSize * (0.35 + aSeed * 0.75) * uPixelRatio / max(-mv.z, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D uMap;',
        'uniform vec3 uColor;',
        'uniform float uOpacity;',
        'varying float vAlpha;',
        'void main() {',
        '  vec4 tex = texture2D(uMap, gl_PointCoord);',
        '  if (tex.a < 0.01) discard;',
        '  gl_FragColor = vec4(uColor, tex.a * uOpacity * vAlpha);',
        '}'
      ].join('\n')
    })
  );
  plankton.frustumCulled = false;
  scene.add(plankton);

  /* ------------------------------------------------------------
     Биолюминесценция: «светлячки» в толще воды.
     Днём почти не видны, ночью разгораются и медленно пульсируют.
     ------------------------------------------------------------ */
  var BIO_COUNT = 150;
  var bioPos = new Float32Array(BIO_COUNT * 3);
  var bioSeed = new Float32Array(BIO_COUNT);
  var bioHue = new Float32Array(BIO_COUNT);

  for (var bj = 0; bj < BIO_COUNT; bj++) {
    bioPos[bj * 3] = rand(-HALF_W + 1, HALF_W - 1);
    bioPos[bj * 3 + 1] = rand(1.0, WATER_Y - 0.5);
    bioPos[bj * 3 + 2] = rand(-HALF_D + 1, HALF_D - 1);
    bioSeed[bj] = rnd();
    bioHue[bj] = rnd();
  }

  var bioGeo = new THREE.BufferGeometry();
  bioGeo.setAttribute('position', new THREE.BufferAttribute(bioPos, 3));
  bioGeo.setAttribute('aSeed', new THREE.BufferAttribute(bioSeed, 1));
  bioGeo.setAttribute('aHue', new THREE.BufferAttribute(bioHue, 1));

  var bioUniforms = {
    uTime: { value: 0 },
    uMap: { value: texDot },
    uSize: { value: 34.0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uIntensity: { value: 0.0 },
    uColorA: { value: new THREE.Color(0x59f7e8) },
    uColorB: { value: new THREE.Color(0xa98cff) }
  };

  var bioPoints = new THREE.Points(
    bioGeo,
    new THREE.ShaderMaterial({
      uniforms: bioUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: [
        'uniform float uTime;',
        'uniform float uSize;',
        'uniform float uPixelRatio;',
        'attribute float aSeed;',
        'attribute float aHue;',
        'varying float vPulse;',
        'varying float vHue;',
        'void main() {',
        '  vec3 p = position;',
        '  float sp = 0.18 + aSeed * 0.34;',
        '  p.x += sin(uTime * sp + aSeed * 42.0) * 1.6;',
        '  p.z += cos(uTime * sp * 0.7 + aSeed * 23.0) * 1.3;',
        '  p.y += sin(uTime * sp * 0.5 + aSeed * 11.0) * 0.7;',
        '  float pulse = 0.5 + 0.5 * sin(uTime * (1.1 + aSeed * 2.4) + aSeed * 30.0);',
        '  vPulse = pow(pulse, 3.2);',
        '  vHue = aHue;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  gl_PointSize = uSize * (0.4 + aSeed * 0.9) * uPixelRatio / max(-mv.z, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D uMap;',
        'uniform float uIntensity;',
        'uniform vec3 uColorA;',
        'uniform vec3 uColorB;',
        'varying float vPulse;',
        'varying float vHue;',
        'void main() {',
        '  vec4 tex = texture2D(uMap, gl_PointCoord);',
        '  if (tex.a < 0.01) discard;',
        '  vec3 col = mix(uColorA, uColorB, vHue);',
        '  float a = tex.a * uIntensity * (0.25 + vPulse * 0.95);',
        '  gl_FragColor = vec4(col * (1.0 + vPulse * 0.8), a);',
        '}'
      ].join('\n')
    })
  );
  bioPoints.frustumCulled = false;
  scene.add(bioPoints);

  /* ------------------------------------------------------------
     Световые режимы: день / закат / ночь
     Параметры плавно интерполируются в цикле.
     ------------------------------------------------------------ */
  var lightModes = {
    day: {
      sunColor: 0xfff3d6, sunIntensity: 2.35, sunPos: [11, 34, 15],
      hemiSky: 0xa9e8ff, hemiGround: 0x14463c, hemiIntensity: 1.05,
      ambientColor: 0x8fd8e8, ambientIntensity: 0.36,
      lampColor: 0xd8f6ff, lampIntensity: 0.95,
      fogColor: 0x0a2f3c, fogDensity: 0.0105,
      skyTop: 0x14424f, skyBottom: 0x03101a,
      exposure: 1.06,
      water: 0x8fe6df, waterOpacity: 0.16,
      plank: 0xcdf3f2, plankOpacity: 0.5,
      bio: 0.0,
      tint: 0xffffff
    },
    sunset: {
      sunColor: 0xff9e5e, sunIntensity: 2.05, sunPos: [22, 15, 6],
      hemiSky: 0xffb489, hemiGround: 0x3a2036, hemiIntensity: 0.85,
      ambientColor: 0xffa478, ambientIntensity: 0.42,
      lampColor: 0xffc79a, lampIntensity: 0.7,
      fogColor: 0x2a1c31, fogDensity: 0.0135,
      skyTop: 0x3b2233, skyBottom: 0x140a16,
      exposure: 1.0,
      water: 0xffb27a, waterOpacity: 0.19,
      plank: 0xffd9b0, plankOpacity: 0.55,
      bio: 0.0,
      tint: 0xffd3b0
    },
    night: {
      sunColor: 0x6f9dd6, sunIntensity: 0.34, sunPos: [-14, 26, -12],
      hemiSky: 0x2a4f7d, hemiGround: 0x061a26, hemiIntensity: 0.42,
      ambientColor: 0x1f4a6b, ambientIntensity: 0.22,
      lampColor: 0x59a8ff, lampIntensity: 0.5,
      fogColor: 0x03121f, fogDensity: 0.0165,
      skyTop: 0x08202f, skyBottom: 0x01070c,
      exposure: 0.94,
      water: 0x4fd6e8, waterOpacity: 0.13,
      plank: 0x9ff0ff, plankOpacity: 0.62,
      bio: 1.0,
      tint: 0x9fc8e8
    }
  };

  var lightState = {
    sunColor: new THREE.Color(lightModes.day.sunColor),
    sunIntensity: lightModes.day.sunIntensity,
    sunPos: new THREE.Vector3().fromArray(lightModes.day.sunPos),
    hemiSky: new THREE.Color(lightModes.day.hemiSky),
    hemiGround: new THREE.Color(lightModes.day.hemiGround),
    hemiIntensity: lightModes.day.hemiIntensity,
    ambientColor: new THREE.Color(lightModes.day.ambientColor),
    ambientIntensity: lightModes.day.ambientIntensity,
    lampColor: new THREE.Color(lightModes.day.lampColor),
    lampIntensity: lightModes.day.lampIntensity,
    fogColor: new THREE.Color(lightModes.day.fogColor),
    fogDensity: lightModes.day.fogDensity,
    skyTop: new THREE.Color(lightModes.day.skyTop),
    skyBottom: new THREE.Color(lightModes.day.skyBottom),
    exposure: lightModes.day.exposure,
    water: new THREE.Color(lightModes.day.water),
    waterOpacity: lightModes.day.waterOpacity,
    plank: new THREE.Color(lightModes.day.plank),
    plankOpacity: lightModes.day.plankOpacity,
    bio: 0,
    tint: new THREE.Color(lightModes.day.tint)
  };

  var targetMode = lightModes.day;
  var lightModeKey = 'day';

  function setLightMode(key) {
    if (!lightModes[key]) return;
    targetMode = lightModes[key];
    lightModeKey = key;
  }

  var tmpColor = new THREE.Color();

  function updateLights(dt) {
    var k = 1 - Math.pow(0.0016, dt); // экспоненциальное сглаживание
    lightState.sunColor.lerp(tmpColor.setHex(targetMode.sunColor), k);
    lightState.sunIntensity = lerp(lightState.sunIntensity, targetMode.sunIntensity, k);
    lightState.sunPos.lerp(new THREE.Vector3().fromArray(targetMode.sunPos), k * 0.8);
    lightState.hemiSky.lerp(tmpColor.setHex(targetMode.hemiSky), k);
    lightState.hemiGround.lerp(tmpColor.setHex(targetMode.hemiGround), k);
    lightState.hemiIntensity = lerp(lightState.hemiIntensity, targetMode.hemiIntensity, k);
    lightState.ambientColor.lerp(tmpColor.setHex(targetMode.ambientColor), k);
    lightState.ambientIntensity = lerp(lightState.ambientIntensity, targetMode.ambientIntensity, k);
    lightState.lampColor.lerp(tmpColor.setHex(targetMode.lampColor), k);
    lightState.lampIntensity = lerp(lightState.lampIntensity, targetMode.lampIntensity, k);
    lightState.fogColor.lerp(tmpColor.setHex(targetMode.fogColor), k);
    lightState.fogDensity = lerp(lightState.fogDensity, targetMode.fogDensity, k);
    lightState.skyTop.lerp(tmpColor.setHex(targetMode.skyTop), k);
    lightState.skyBottom.lerp(tmpColor.setHex(targetMode.skyBottom), k);
    lightState.exposure = lerp(lightState.exposure, targetMode.exposure, k);
    lightState.water.lerp(tmpColor.setHex(targetMode.water), k);
    lightState.waterOpacity = lerp(lightState.waterOpacity, targetMode.waterOpacity, k);
    lightState.plank.lerp(tmpColor.setHex(targetMode.plank), k);
    lightState.plankOpacity = lerp(lightState.plankOpacity, targetMode.plankOpacity, k);
    lightState.bio = lerp(lightState.bio, targetMode.bio, k);
    lightState.tint.lerp(tmpColor.setHex(targetMode.tint), k);

    sun.color.copy(lightState.sunColor);
    sun.intensity = lightState.sunIntensity;
    sun.position.copy(lightState.sunPos);
    hemi.color.copy(lightState.hemiSky);
    hemi.groundColor.copy(lightState.hemiGround);
    hemi.intensity = lightState.hemiIntensity;
    ambient.color.copy(lightState.ambientColor);
    ambient.intensity = lightState.ambientIntensity;
    tankLamp.color.copy(lightState.lampColor);
    tankLamp.intensity = lightState.lampIntensity;

    scene.fog.color.copy(lightState.fogColor);
    scene.fog.density = lightState.fogDensity;
    backdropUniforms.uTop.value.copy(lightState.skyTop);
    backdropUniforms.uBottom.value.copy(lightState.skyBottom);
    renderer.toneMappingExposure = lightState.exposure;

    waterUniforms.uTint.value.copy(lightState.water);
    waterUniforms.uOpacity.value = lightState.waterOpacity;
    waterUniforms.uGlow.value = 1 - lightState.bio * 0.35;
    bioUniforms.uIntensity.value = lightState.bio;
    planktonUniforms.uColor.value.copy(lightState.plank);
    planktonUniforms.uOpacity.value = lightState.plankOpacity;
  }


  /* ------------------------------------------------------------
     РЫБЫ
     Тело — сфера, вытянутая вдоль оси Z (нос смотрит в +Z).
     Хвост и плавники — отдельные меши, которыми двигаем в цикле.
     Геометрии создаются один раз на вид и переиспользуются;
     материалы тоже общие на вид — это экономит вызовы отрисовки.
     ------------------------------------------------------------ */

  /* Материал чешуи: текстура общая, оттенок задаёт цвет материала */
  var fishBodyMatBase = new THREE.MeshStandardMaterial({
    map: texFish,
    roughness: 0.42,
    metalness: 0.14,
    envMapIntensity: 0.85
  });

  var fishEyeMat = new THREE.MeshStandardMaterial({ color: 0x0a1014, roughness: 0.15, metalness: 0.4 });

  /* Виды: пропорции, окраска, характер движения.
     Тело — сфера радиуса 1, растянутая по осям:
     bodyLen по Z (длина), bodyH по Y (высота), bodyW по X (ширина). */
  var SPECIES = [
    {
      name: 'neon',
      bodyLen: 1.35, bodyH: 0.46, bodyW: 0.36,
      tailLen: 0.62, tailH: 0.62, finScale: 0.9,
      color: 0x2ec6d8, accent: 0xff5a52,
      speed: 4.2, wag: 9.5, wagAmp: 0.44,
      bioColor: 0x4fe3ff
    },
    {
      name: 'angel',
      bodyLen: 1.05, bodyH: 0.92, bodyW: 0.26,
      tailLen: 0.72, tailH: 0.92, finScale: 1.3,
      color: 0xffb648, accent: 0x2a2f66,
      speed: 3.1, wag: 7.0, wagAmp: 0.30,
      bioColor: 0x9be8ff
    },
    {
      name: 'clown',
      bodyLen: 1.22, bodyH: 0.58, bodyW: 0.40,
      tailLen: 0.58, tailH: 0.60, finScale: 1.0,
      color: 0xff7a45, accent: 0xf7f4ec,
      speed: 4.7, wag: 11.0, wagAmp: 0.52,
      bioColor: 0xffd08a
    },
    {
      name: 'royal',
      bodyLen: 1.30, bodyH: 0.70, bodyW: 0.34,
      tailLen: 0.80, tailH: 0.85, finScale: 1.2,
      color: 0x9163e0, accent: 0x59f0c4,
      speed: 3.4, wag: 8.0, wagAmp: 0.36,
      bioColor: 0xc9a4ff
    }
  ];

  /* Сфера-тело, вытянутая по Z и сжатая по X */
  var bodyGeoBase = new THREE.SphereGeometry(1, 20, 14);

  /* Хвост: плоский веер из треугольников */
  function makeTailGeometry(len, h) {
    var g = new THREE.BufferGeometry();
    var verts = new Float32Array([
      0, 0, 0,
      0, h * 0.5, -len,
      0, -h * 0.5, -len,
      0, h * 0.18, -len * 0.55,
      0, -h * 0.18, -len * 0.55
    ]);
    var idx = [0, 1, 3, 0, 3, 4, 0, 4, 2, 3, 1, 4, 4, 1, 2];
    g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  /* Спинной и брюшной плавники */
  function makeDorsalGeometry(h, back) {
    var g = new THREE.BufferGeometry();
    var verts = new Float32Array([
      0, 0, back,
      0, h, back - 0.42,
      0, 0, back - 0.75
    ]);
    g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    g.setIndex([0, 1, 2]);
    g.computeVertexNormals();
    return g;
  }

  /* Грудной плавник — маленький треугольник вбок */
  function makeSideFinGeometry(len) {
    var g = new THREE.BufferGeometry();
    var verts = new Float32Array([
      0, 0, 0,
      len, -len * 0.45, -len * 0.7,
      len * 0.18, -len * 0.75, -len * 0.2
    ]);
    g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    g.setIndex([0, 1, 2]);
    g.computeVertexNormals();
    return g;
  }

  /* ------------------------------------------------------------
     Геометрия тела с поддержкой волнообразного изгиба.
     В вершинном шейдере смещаем каждую вершину по X в зависимости
     от её положения вдоль тела (Z) и фазы взмаха. Так корпус рыбы
     изгибается волной, а не поворачивается целиком.
     ------------------------------------------------------------ */
  /* Один генератор шейдерной правки на все тела — принимает набор юниформов */
  function makeWaveCompile(uniforms) {
    return function (shader) {
      shader.uniforms.uWavePhase = uniforms.uWavePhase;
      shader.uniforms.uWaveAmp = uniforms.uWaveAmp;
      shader.uniforms.uBodyLen = uniforms.uBodyLen;

      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', [
          '#include <common>',
          'uniform float uWavePhase;',
          'uniform float uWaveAmp;',
          'uniform float uBodyLen;'
        ].join('\n'))
        .replace('#include <begin_vertex>', [
          '#include <begin_vertex>',
          // голова (z > 0) почти неподвижна, хвостовая часть изгибается сильнее
          'float along = clamp((-transformed.z / uBodyLen) * 0.5 + 0.5, 0.0, 1.0);',
          'float bendW = along * along;',
          'transformed.x += sin(uWavePhase - along * 2.6) * uWaveAmp * bendW;'
        ].join('\n'));
    };
  }

  function makeFishBodyMaterial(sp) {
    var mat = fishBodyMatBase.clone();
    mat.color.setHex(sp.color);
    mat.emissive.setHex(sp.bioColor);
    mat.emissiveIntensity = 0.0;
    mat.waveUniforms = {
      uWavePhase: { value: 0 },
      uWaveAmp: { value: sp.bodyW * 0.8 },
      uBodyLen: { value: sp.bodyLen }
    };
    mat.onBeforeCompile = makeWaveCompile(mat.waveUniforms);
    mat.customProgramCacheKey = function () { return 'fish-wave'; };
    return mat;
  }

  /* Геометрии для каждого вида — считаются один раз */
  var speciesAssets = SPECIES.map(function (sp) {
    var bodyGeo = bodyGeoBase.clone();
    bodyGeo.scale(sp.bodyW, sp.bodyH, sp.bodyLen);

    return {
      body: bodyGeo,
      tail: makeTailGeometry(sp.tailLen, sp.tailH),
      dorsal: makeDorsalGeometry(sp.bodyH * 0.55 * sp.finScale, sp.bodyLen * 0.22),
      sideFin: makeSideFinGeometry(sp.bodyLen * 0.26 * sp.finScale),
      bodyMat: makeFishBodyMaterial(sp),
      // Плавники полупрозрачные, с лёгким свечением по контуру
      accentMat: new THREE.MeshStandardMaterial({
        color: sp.accent,
        roughness: 0.52,
        metalness: 0.1,
        transparent: true,
        opacity: 0.88,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    };
  });

  speciesAssets.forEach(function (a, i) {
    a.accentMat.emissive = new THREE.Color(SPECIES[i].bioColor);
    a.accentMat.emissiveIntensity = 0.0;
  });

  /* Общая геометрия глаза */
  var eyeGeo = new THREE.SphereGeometry(1, 8, 6);

  /* ------------------------------------------------------------
     Создание одной рыбы
     ------------------------------------------------------------ */
  function createFish(speciesIndex, baseScale) {
    var sp = SPECIES[speciesIndex];
    var assets = speciesAssets[speciesIndex];

    var root = new THREE.Group();
    // Внутренняя группа нужна для наклона при поворотах
    var pivot = new THREE.Group();
    root.add(pivot);

    // Собственный материал тела: у каждой рыбы своя фаза волны.
    // Клонируем шаблон вида вместе с его юниформами.
    var bodyMat = assets.bodyMat.clone();
    bodyMat.waveUniforms = {
      uWavePhase: { value: rand(0, 6.28) },
      uWaveAmp: { value: assets.bodyMat.waveUniforms.uWaveAmp.value },
      uBodyLen: { value: sp.bodyLen }
    };
    bodyMat.onBeforeCompile = makeWaveCompile(bodyMat.waveUniforms);
    bodyMat.customProgramCacheKey = function () { return 'fish-wave'; };

    var body = new THREE.Mesh(assets.body, bodyMat);
    body.castShadow = true;
    body.receiveShadow = false;
    pivot.add(body);

    var tail = new THREE.Mesh(assets.tail, assets.accentMat);
    tail.position.z = -sp.bodyLen * 0.82;
    tail.castShadow = true;
    pivot.add(tail);

    var dorsal = new THREE.Mesh(assets.dorsal, assets.accentMat);
    dorsal.position.y = sp.bodyH * 0.72;
    pivot.add(dorsal);

    // брюшной плавник — маленький, симметричный спинному
    var anal = new THREE.Mesh(assets.dorsal, assets.accentMat);
    anal.position.y = -sp.bodyH * 0.72;
    anal.scale.y = -0.55;
    anal.position.z = -sp.bodyLen * 0.30;
    pivot.add(anal);

    var finL = new THREE.Mesh(assets.sideFin, assets.accentMat);
    finL.position.set(sp.bodyW * 0.80, -sp.bodyH * 0.16, sp.bodyLen * 0.24);
    pivot.add(finL);

    var finR = new THREE.Mesh(assets.sideFin, assets.accentMat);
    finR.position.set(-sp.bodyW * 0.80, -sp.bodyH * 0.16, sp.bodyLen * 0.24);
    finR.scale.x = -1;
    pivot.add(finR);

    // глаза сидят на самом теле, чуть выше середины и ближе к носу
    var eyeSize = sp.bodyH * 0.20;
    var eyeX = sp.bodyW * 0.52;
    var eyeY = sp.bodyH * 0.30;
    var eyeZ = sp.bodyLen * 0.62;
    var eye1 = new THREE.Mesh(eyeGeo, fishEyeMat);
    eye1.scale.setScalar(eyeSize);
    eye1.position.set(eyeX, eyeY, eyeZ);
    pivot.add(eye1);

    var eye2 = new THREE.Mesh(eyeGeo, fishEyeMat);
    eye2.scale.setScalar(eyeSize);
    eye2.position.set(-eyeX, eyeY, eyeZ);
    pivot.add(eye2);

    root.scale.setScalar(baseScale);
    scene.add(root);

    return {
      root: root,
      pivot: pivot,
      body: body,
      bodyMat: bodyMat,
      wave: bodyMat.waveUniforms,
      tail: tail,
      finL: finL,
      finR: finR,
      species: speciesIndex,
      sp: sp,
      assets: assets,
      scale: baseScale,

      // Физика
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      desired: new THREE.Vector3(),
      forward: new THREE.Vector3(0, 0, 1),
      speed: sp.speed * rand(0.85, 1.15),
      maxSpeed: sp.speed * rand(0.9, 1.15),
      panic: 0,
      wagPhase: rand(0, 6.28),
      wagSpeed: sp.wag * rand(0.85, 1.2),
      bobPhase: rand(0, 6.28),
      roll: 0,
      prevHeading: 0,
      targetFlake: null,
      hunger: rand(0, 1),
      scaleBase: baseScale
    };
  }

  /* ------------------------------------------------------------
     Массив рыб
     ------------------------------------------------------------ */
  var fishes = [];
  var fishCount = 40;

  function spawnFish(i) {
    // распределение видов: больше всего неонов
    var roll = rnd();
    var speciesIndex = roll < 0.42 ? 0 : (roll < 0.68 ? 1 : (roll < 0.88 ? 2 : 3));
    // Ангелы и «королевские» крупнее, неоны и клоуны — мельче
    var baseScale = speciesIndex === 1 ? rand(1.0, 1.2)
      : speciesIndex === 3 ? rand(0.95, 1.12)
        : rand(0.8, 1.0);
    var f = createFish(speciesIndex, baseScale);

    f.pos.set(
      rand(-HALF_W + 3, HALF_W - 3),
      rand(3.5, WATER_Y - 2.5),
      rand(-HALF_D + 2.5, HALF_D - 2.5)
    );
    var a = rand(0, 6.28);
    f.vel.set(Math.cos(a), rand(-0.15, 0.15), Math.sin(a)).normalize().multiplyScalar(f.speed);
    f.root.position.copy(f.pos);
    fishes.push(f);
    return f;
  }

  for (var fi = 0; fi < MAX_FISH; fi++) spawnFish(fi);
  // Активными считаются первые fishCount
  for (var fi2 = 0; fi2 < fishes.length; fi2++) {
    fishes[fi2].root.visible = fi2 < fishCount;
  }

  var activeFish = fishes.slice(0, fishCount);

  function setFishCount(n) {
    n = clamp(Math.round(n), 1, MAX_FISH);
    fishCount = n;
    activeFish = fishes.slice(0, n);
    for (var i = 0; i < fishes.length; i++) {
      fishes[i].root.visible = i < n;
    }
    document.getElementById('statFish').textContent = n + ' рыб';
    document.getElementById('fishVal').textContent = n;
  }

  /* ------------------------------------------------------------
     КОРМ: хлопья, оседающие на дно
     ------------------------------------------------------------ */
  var flakeGeo = new THREE.PlaneGeometry(0.26, 0.26);
  var flakeMat = new THREE.MeshStandardMaterial({
    map: texFlake,
    color: 0xf3d9a4,
    roughness: 0.85,
    metalness: 0.0,
    transparent: true,
    alphaTest: 0.05,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  var flakes = [];
  for (var fl = 0; fl < MAX_FLAKES; fl++) {
    var m = new THREE.Mesh(flakeGeo, flakeMat);
    m.visible = false;
    m.castShadow = false;
    scene.add(m);
    flakes.push({
      mesh: m,
      alive: false,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      spin: rand(-2, 2),
      spinAxis: new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize(),
      settled: false,
      claimedBy: null,
      life: 0
    });
  }
  var flakeCursor = 0;
  var flakeCount = 0;

  function spawnFlake(x, y, z) {
    var f = null;
    for (var i = 0; i < MAX_FLAKES; i++) {
      var idx = (flakeCursor + i) % MAX_FLAKES;
      if (!flakes[idx].alive) { f = flakes[idx]; flakeCursor = (idx + 1) % MAX_FLAKES; break; }
    }
    if (!f) return null;

    f.alive = true;
    f.settled = false;
    f.claimedBy = null;
    f.life = 0;
    f.sinkSpeed = 0;
    f.pos.set(
      clamp(x + rand(-1.3, 1.3), -HALF_W + 0.5, HALF_W - 0.5),
      WATER_Y - 0.05,
      clamp(z + rand(-1.1, 1.1), -HALF_D + 0.5, HALF_D - 0.5)
    );
    f.vel.set(rand(-0.25, 0.25), rand(-0.18, -0.05), rand(-0.25, 0.25));
    f.mesh.visible = true;
    f.mesh.position.copy(f.pos);
    f.mesh.rotation.set(rand(0, 6.28), rand(0, 6.28), rand(0, 6.28));
    f.mesh.scale.setScalar(rand(0.7, 1.35));
    flakeCount++;
    return f;
  }

  function dropFood(worldX, worldZ) {
    var made = 0;
    for (var i = 0; i < 16; i++) {
      if (spawnFlake(worldX, WATER_Y, worldZ)) made++;
    }
    // всплеск на поверхности: расходящееся кольцо
    makeRipple(worldX, worldZ);
    return made;
  }

  /* ------------------------------------------------------------
     Круги на воде от брошенного корма
     ------------------------------------------------------------ */
  var ripples = [];
  var rippleGeo = new THREE.RingGeometry(0.35, 0.48, 40);
  for (var rp = 0; rp < 6; rp++) {
    var rm = new THREE.Mesh(
      rippleGeo,
      new THREE.MeshBasicMaterial({
        color: 0xd8fbff,
        transparent: true,
        opacity: 0,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    rm.rotation.x = -Math.PI / 2;
    rm.visible = false;
    scene.add(rm);
    ripples.push({ mesh: rm, t: 1, x: 0, z: 0, delay: 0 });
  }
  var rippleCursor = 0;

  function makeRipple(x, z) {
    for (var i = 0; i < 3; i++) {
      var r = ripples[(rippleCursor + i) % ripples.length];
      r.t = 0;
      r.x = x; r.z = z;
      r.delay = i * 0.18;
      r.mesh.visible = true;
      r.mesh.position.set(x, WATER_Y + 0.06, z);
      r.mesh.scale.setScalar(0.5);
      r.mesh.material.opacity = 0;
    }
    rippleCursor = (rippleCursor + 3) % ripples.length;
  }

  /* ------------------------------------------------------------
     BOIDS: разделение, выравнивание, сплочённость
     Плюс уклонение от стенок, реакция на курсор и погоня за кормом.
     ------------------------------------------------------------ */
  var FLEE_RADIUS = 5.2;
  var mouseWorld = new THREE.Vector3(0, 0, 0);
  var mouseActive = false;
  var mouseStrength = 0;

  var sepVec = new THREE.Vector3();
  var aliVec = new THREE.Vector3();
  var cohVec = new THREE.Vector3();
  var fleeVec = new THREE.Vector3();
  var foodVec = new THREE.Vector3();
  var wallVec = new THREE.Vector3();
  var acc = new THREE.Vector3();
  var tmpV = new THREE.Vector3();
  var tmpV2 = new THREE.Vector3();

  var SEP_DIST = 2.5;
  var NEIGHBOR_DIST = 7.2;

  /* Снимаем «бронь» с хлопьи, чтобы другие рыбы могли её взять */
  function releaseTarget(f) {
    if (f.targetFlake && f.targetFlake.claimedBy === f) {
      f.targetFlake.claimedBy = null;
    }
    f.targetFlake = null;
  }

  /* Отталкивание от стенок: чем ближе к стеклу, тем сильнее.
     По высоте отталкивание мягче, иначе рыбы «прилипают» к полу
     и к поверхности воды. */
  function wallAvoidance(p, out) {
    out.set(0, 0, 0);
    var m = 2.6;
    if (p.x > HALF_W - m) out.x -= (p.x - (HALF_W - m)) * 3.0;
    if (p.x < -HALF_W + m) out.x -= (p.x + (HALF_W - m)) * 3.0;
    if (p.z > HALF_D - m) out.z -= (p.z - (HALF_D - m)) * 3.4;
    if (p.z < -HALF_D + m) out.z -= (p.z + (HALF_D - m)) * 3.4;

    // Верх и низ: мягко возвращаем рыбу в толщу воды.
    // Коэффициенты подобраны так, чтобы стая не «налипала» на стекло
    // и не висела у поверхности.
    if (p.y > WATER_Y - 2.4) out.y -= (p.y - (WATER_Y - 2.4)) * 2.6;
    if (p.y < 4.0) out.y -= (p.y - 4.0) * 2.4;

    // Постоянная тяга к средней глубине
    var midY = (WATER_Y + 2.0) * 0.5;
    out.y += (midY - p.y) * 0.9;
    return out;
  }

  function updateBoids(dt, simTime) {
    var n = activeFish.length;
    var i, j, f, other;

    for (i = 0; i < n; i++) {
      f = activeFish[i];
      sepVec.set(0, 0, 0);
      aliVec.set(0, 0, 0);
      cohVec.set(0, 0, 0);
      fleeVec.set(0, 0, 0);
      foodVec.set(0, 0, 0);
      var neighbors = 0;
      var sepCount = 0;

      for (j = 0; j < n; j++) {
        if (j === i) continue;
        other = activeFish[j];
        var dx = f.pos.x - other.pos.x;
        var dy = f.pos.y - other.pos.y;
        var dz = f.pos.z - other.pos.z;
        var d2 = dx * dx + dy * dy + dz * dz;

        if (d2 < SEP_DIST * SEP_DIST && d2 > 0.0001) {
          var inv = 1 / Math.sqrt(d2);
          sepVec.x += dx * inv * inv;
          sepVec.y += dy * inv * inv;
          sepVec.z += dz * inv * inv;
          sepCount++;
        }

        if (d2 < NEIGHBOR_DIST * NEIGHBOR_DIST) {
          aliVec.x += other.vel.x;
          aliVec.y += other.vel.y;
          aliVec.z += other.vel.z;
          cohVec.x += other.pos.x;
          cohVec.y += other.pos.y;
          cohVec.z += other.pos.z;
          neighbors++;
        }
      }

      acc.set(0, 0, 0);

      // 1. Разделение
      if (sepCount > 0) {
        sepVec.multiplyScalar(1 / sepCount);
        acc.addScaledVector(sepVec, 26.0);
      }

      // 2. Выравнивание
      if (neighbors > 0) {
        aliVec.multiplyScalar(1 / neighbors);
        aliVec.sub(f.vel);
        acc.addScaledVector(aliVec, 1.05);

        // 3. Сплочённость
        cohVec.multiplyScalar(1 / neighbors);
        cohVec.sub(f.pos);
        acc.addScaledVector(cohVec, 0.34);
      }

      // 4. Стены
      wallAvoidance(f.pos, wallVec);
      acc.add(wallVec);

      // 5. Испуг от курсора
      if (mouseActive && mouseStrength > 0.001) {
        tmpV.copy(f.pos).sub(mouseWorld);
        var dist = tmpV.length();
        if (dist < FLEE_RADIUS && dist > 0.0001) {
          var strength = (1 - dist / FLEE_RADIUS);
          strength = strength * strength * mouseStrength;
          tmpV.multiplyScalar(1 / dist);
          // убегаем по горизонтали, слегка вниз — к укрытию
          tmpV.y -= 0.22;
          fleeVec.copy(tmpV).multiplyScalar(strength * 46);
          acc.add(fleeVec);
          f.panic = Math.min(1, f.panic + strength * dt * 5.5);
        }
      }

      // 6. Корм: плывём к своей хлопье, пока она существует
      if (f.targetFlake && f.targetFlake.alive) {
        var tf = f.targetFlake;
        foodVec.copy(tf.pos).sub(f.pos);
        var fd = foodVec.length();
        if (fd > 0.001) {
          foodVec.multiplyScalar(1 / fd);
          acc.addScaledVector(foodVec, 26 + f.hunger * 20);
        }
        if (fd > 18) releaseTarget(f);
      } else {
        releaseTarget(f);
      }

      // Случайное блуждание — стая не застывает на месте.
      // По вертикали качаем слабее, иначе рыбы «всплывают» к поверхности.
      tmpV2.set(
        Math.sin(simTime * 0.7 + f.bobPhase) * 3.4,
        Math.sin(simTime * 0.53 + f.bobPhase * 1.7) * 0.65,
        Math.cos(simTime * 0.61 + f.bobPhase * 0.8) * 3.4
      );
      acc.add(tmpV2);

      // Гасим страх со временем
      f.panic = Math.max(0, f.panic - dt * 0.55);
      if (f.panic < 0.001) f.panic = 0;

      // --- интегрируем ---
      f.desired.copy(f.vel).addScaledVector(acc, dt);
      var maxS = f.maxSpeed * (1 + f.panic * 1.7) * (f.targetFlake ? 1.35 : 1);
      var minS = f.sp.speed * 0.42;
      var sp2 = f.desired.length();
      if (sp2 > maxS) {
        f.desired.multiplyScalar(maxS / sp2);
      } else if (sp2 < minS) {
        // рыба не зависает на месте — держим минимальный ход
        if (sp2 < 0.0001) f.desired.copy(f.forward);
        f.desired.multiplyScalar(minS / Math.max(sp2, 0.0001));
      }

      f.vel.lerp(f.desired, clamp(dt * 4.2, 0, 1));

      // держим рыбу строго внутри аквариума
      f.pos.addScaledVector(f.vel, dt);
      f.pos.x = clamp(f.pos.x, -HALF_W + 0.7, HALF_W - 0.7);
      f.pos.y = clamp(f.pos.y, 1.8, WATER_Y - 0.7);
      f.pos.z = clamp(f.pos.z, -HALF_D + 0.7, HALF_D - 0.7);

      // Мягкое покачивание по высоте
      f.root.position.copy(f.pos);
    }
  }

  /* ------------------------------------------------------------
     Визуальная часть движения рыбы: разворот, махи хвостом, крен
     ------------------------------------------------------------ */

  function updateFishVisuals(dt, simTime) {
    var n = activeFish.length;
    for (var i = 0; i < n; i++) {
      var f = activeFish[i];

      // направление движения
      if (f.vel.lengthSq() > 0.0004) {
        tmpV.copy(f.vel).normalize();
        // плавно доводим текущий forward до целевого
        f.forward.lerp(tmpV, clamp(dt * 6.5, 0, 1)).normalize();
      }

      var speedNorm = clamp(f.vel.length() / (f.maxSpeed * 1.6), 0, 1);

      // Ориентация: нос по forward
      f.root.lookAt(
        f.root.position.x + f.forward.x,
        f.root.position.y + f.forward.y,
        f.root.position.z + f.forward.z
      );

      // Крен на повороте: смотрим, насколько быстро меняется направление
      var dHeading = Math.atan2(f.forward.x, f.forward.z) - f.prevHeading;
      while (dHeading > Math.PI) dHeading -= Math.PI * 2;
      while (dHeading < -Math.PI) dHeading += Math.PI * 2;
      f.prevHeading = Math.atan2(f.forward.x, f.forward.z);

      var targetRoll = clamp(-dHeading / Math.max(dt, 0.0001) * 0.16, -0.7, 0.7);
      f.roll = lerp(f.roll, targetRoll, clamp(dt * 5, 0, 1));
      f.pivot.rotation.z = f.roll;

      // Махи хвостом: амплитуда растёт со скоростью.
      // Хвост — плоский веер в плоскости YZ, поэтому качаем его вокруг Y.
      f.wagPhase += dt * f.wagSpeed * (0.55 + speedNorm * 1.35) * (1 + f.panic * 0.9);
      var amp = f.sp.wagAmp * (0.42 + speedNorm * 0.85 + f.panic * 0.5);
      f.tail.rotation.y = Math.sin(f.wagPhase) * amp;
      f.tail.rotation.z = Math.cos(f.wagPhase * 0.5) * amp * 0.10;

      // Волна по корпусу: тот же фазовый сдвиг уходит в вершинный шейдер,
      // поэтому хвост и тело изгибаются согласованно.
      f.wave.uWavePhase.value = f.wagPhase;
      f.wave.uWaveAmp.value = f.sp.bodyW * (0.55 + speedNorm * 0.85 + f.panic * 0.4);

      // Плавники работают в противофазе
      f.finL.rotation.y = Math.sin(f.wagPhase * 1.6 + 1.2) * 0.5;
      f.finR.rotation.y = -Math.sin(f.wagPhase * 1.6 + 1.2) * 0.5;
      f.finL.rotation.z = 0.28 + Math.cos(f.wagPhase * 1.6) * 0.16;
      f.finR.rotation.z = -0.28 - Math.cos(f.wagPhase * 1.6) * 0.16;

      // Волнообразное покачивание корпуса
      f.pivot.position.y = Math.sin(f.wagPhase * 0.5) * 0.03;

      // Немного «дышим» масштабом — едва заметно
      var breathe = 1 + Math.sin(simTime * 1.7 + f.bobPhase) * 0.012;
      f.root.scale.setScalar(f.scaleBase * breathe);

      // Биолюминесценция: ночью тело начинает светиться,
      // испуганная рыба вспыхивает заметно ярче.
      var bioTarget = lightState.bio * (0.14 + f.panic * 0.75);
      f.bodyMat.emissiveIntensity = lerp(f.bodyMat.emissiveIntensity, bioTarget, clamp(dt * 5, 0, 1));
    }
  }

  /* ------------------------------------------------------------
     Поиск корма: каждая рыба выбирает ближайшую свободную хлопью
     ------------------------------------------------------------ */
  var flakeSeekTimer = 0;

  function assignFoodTargets(dt) {
    flakeSeekTimer -= dt;
    if (flakeSeekTimer > 0) return;
    flakeSeekTimer = 0.12;

    var n = activeFish.length;
    for (var i = 0; i < n; i++) {
      var f = activeFish[i];
      if (f.targetFlake && f.targetFlake.alive) continue;
      f.targetFlake = null;

      // Сытость растёт, если рыба давно не ела
      f.hunger = Math.min(1, f.hunger + dt * 0.06);

      var best = null, bestD = 1e9;
      for (var k = 0; k < MAX_FLAKES; k++) {
        var fl2 = flakes[k];
        if (!fl2.alive || fl2.claimedBy && fl2.claimedBy !== f) continue;
        var d = f.pos.distanceToSquared(fl2.pos);
        if (d < bestD) { bestD = d; best = fl2; }
      }

      // Радиус обнаружения зависит от голода: голодная рыба видит дальше
      var senseR = 9 + f.hunger * 12;
      if (best && bestD < senseR * senseR) {
        f.targetFlake = best;
        best.claimedBy = f;
      }
    }
  }

  /* ------------------------------------------------------------
     Обновление хлопьев: погружение, сопротивление воды, поедание
     ------------------------------------------------------------ */
  var flakeEatFx = [];

  function updateFlakes(dt, simTime) {
    var n = activeFish.length;

    for (var k = 0; k < MAX_FLAKES; k++) {
      var fl2 = flakes[k];
      if (!fl2.alive) continue;

      fl2.life += dt;

      if (!fl2.settled) {
        // Хлопья тонут медленно и с постоянной скоростью: вода почти
        // сразу гасит ускорение, дальше движение равномерное.
        // Плюс лёгкое колыхание из стороны в сторону.
        fl2.sinkSpeed = Math.min((fl2.sinkSpeed || 0) + 2.2 * dt, 1.05);
        fl2.pos.y -= fl2.sinkSpeed * dt;

        fl2.swayX = (fl2.swayX || 0) + Math.sin(simTime * 1.6 + k * 1.7) * 0.55 * dt;
        fl2.swayZ = (fl2.swayZ || 0) + Math.cos(simTime * 1.25 + k * 2.3) * 0.55 * dt;
        // колыхание ограничено, чтобы хлопья не уплывали далеко
        fl2.swayX = clamp(fl2.swayX, -0.9, 0.9);
        fl2.swayZ = clamp(fl2.swayZ, -0.9, 0.9);

        fl2.pos.x += Math.cos(simTime * 1.6 + k * 1.7) * 0.35 * dt;
        fl2.pos.z += Math.sin(simTime * 1.25 + k * 2.3) * 0.35 * dt;

        var groundY = terrainHeight(fl2.pos.x, fl2.pos.z) + 0.06;
        if (fl2.pos.y <= groundY) {
          fl2.pos.y = groundY;
          fl2.settled = true;
          fl2.vel.set(0, 0, 0);
        }
        fl2.pos.x = clamp(fl2.pos.x, -HALF_W + 0.3, HALF_W - 0.3);
        fl2.pos.z = clamp(fl2.pos.z, -HALF_D + 0.3, HALF_D - 0.3);

        fl2.mesh.position.copy(fl2.pos);
        fl2.mesh.rotation.x += fl2.spin * dt * 0.5;
        fl2.mesh.rotation.y += fl2.spin * dt * 0.35;
      } else {
        // на дне медленно размокает
        fl2.mesh.rotation.z += dt * 0.1;
      }

      // Поедание
      for (var i = 0; i < n; i++) {
        var f = activeFish[i];
        if (f.targetFlake !== fl2) continue;
        var reach = 0.42 + f.scaleBase * 0.55;
        if (f.pos.distanceToSquared(fl2.pos) < reach * reach) {
          fl2.alive = false;
          fl2.mesh.visible = false;
          fl2.claimedBy = null;
          flakeCount--;
          f.targetFlake = null;
          f.hunger = Math.max(0, f.hunger - 0.55);
          spawnEatFx(fl2.pos);
          break;
        }
      }

      // Корм, пролежавший слишком долго, исчезает
      if (fl2.alive && fl2.life > 60) {
        fl2.alive = false;
        fl2.mesh.visible = false;
        fl2.claimedBy = null;
        flakeCount--;
      }
    }

    // вспышки при поедании
    for (var e = flakeEatFx.length - 1; e >= 0; e--) {
      var fx = flakeEatFx[e];
      fx.t += dt * 2.2;
      if (fx.t >= 1) {
        fx.mesh.visible = false;
        flakeEatFx.splice(e, 1);
        continue;
      }
      fx.mesh.material.opacity = (1 - fx.t) * 0.85;
      fx.mesh.scale.setScalar(0.3 + fx.t * 1.5);
    }
  }

  var eatFxGeo = new THREE.RingGeometry(0.18, 0.3, 16);
  function spawnEatFx(pos) {
    var mesh = null;
    for (var i = 0; i < eatFxPool.length; i++) {
      if (!eatFxPool[i].mesh.visible) { mesh = eatFxPool[i].mesh; break; }
    }
    if (!mesh) return;
    mesh.position.copy(pos);
    mesh.scale.setScalar(0.3);
    mesh.material.opacity = 0.85;
    mesh.visible = true;
    flakeEatFx.push({ mesh: mesh, t: 0 });
  }

  var eatFxPool = [];
  for (var ei = 0; ei < 16; ei++) {
    var em = new THREE.Mesh(eatFxGeo, new THREE.MeshBasicMaterial({
      color: 0xfff0c4,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    em.visible = false;
    scene.add(em);
    eatFxPool.push({ mesh: em });
  }


  /* ------------------------------------------------------------
     Курсор: луч в объём аквариума
     ------------------------------------------------------------ */
  var raycaster = new THREE.Raycaster();
  var pointerNdc = new THREE.Vector2(0, 0);
  var pointerOnCanvas = false;

  /* Луч курсора пересекаем с двумя плоскостями:
     — срединная плоскость (z = 0) даёт точку «прицеливания» в объёме;
     — плоскость воды (y = WATER_Y) даёт место, куда падает корм.
     Обе точки зажимаем внутри аквариума. */
  var midPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  var waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_Y);
  var hitMid = new THREE.Vector3();
  var hitWater = new THREE.Vector3();
  var mouseInTank = false;

  function updatePointerFromRay() {
    if (!pointerOnCanvas) {
      mouseActive = false;
      mouseStrength = Math.max(0, mouseStrength - 0.08);
      return;
    }

    raycaster.setFromCamera(pointerNdc, camera);

    var ok = raycaster.ray.intersectPlane(midPlane, hitMid);
    if (ok) {
      mouseWorld.set(
        clamp(hitMid.x, -HALF_W + 0.4, HALF_W - 0.4),
        clamp(hitMid.y, 1.2, WATER_Y - 0.3),
        clamp(hitMid.z, -HALF_D + 0.4, HALF_D - 0.4)
      );
      // курсор «в аквариуме», если луч прошёл близко к его объёму
      mouseInTank = Math.abs(hitMid.x) < HALF_W + 1.5 &&
                    Math.abs(hitMid.y) < TANK_H + 1.5;
    } else {
      mouseInTank = false;
    }

    mouseActive = mouseInTank;
    mouseStrength = mouseActive
      ? Math.min(1, mouseStrength + 0.14)
      : Math.max(0, mouseStrength - 0.08);
  }

  var surfaceHit = new THREE.Vector3();

  /* Куда бросать корм по клику.
     Камера стоит примерно на уровне воды, поэтому пересечение луча
     именно с плоскостью воды находится далеко не всегда (а снизу —
     вообще никогда). Вместо этого берём точку на срединной плоскости
     аквариума: она надёжно определяет, куда именно показал пользователь,
     а корм всё равно сыплется на поверхность. */
  function screenToSurfacePoint(clientX, clientY, out) {
    pointerNdc.x = (clientX / window.innerWidth) * 2 - 1;
    pointerNdc.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);

    var p = raycaster.ray.intersectPlane(midPlane, hitWater);
    if (!p) return false;

    // Клик мимо аквариума (по фону или тумбе) игнорируем
    if (Math.abs(hitWater.x) > HALF_W + 0.6 || Math.abs(hitWater.z) > HALF_D + 0.6) return false;

    out.set(
      clamp(hitWater.x, -HALF_W + 1.2, HALF_W - 1.2),
      WATER_Y,
      clamp(hitWater.z, -HALF_D + 1.2, HALF_D - 1.2)
    );
    return true;
  }

  /* ------------------------------------------------------------
     События мыши и касаний
     ------------------------------------------------------------ */
  var pointerDown = { x: 0, y: 0, time: 0, button: 0, moved: false };

  renderer.domElement.addEventListener('pointermove', function (e) {
    pointerNdc.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerNdc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    pointerOnCanvas = true;

    if (pointerDown.button === 0 && pointerDown.time > 0) {
      var dx = e.clientX - pointerDown.x;
      var dy = e.clientY - pointerDown.y;
      if (dx * dx + dy * dy > 36) pointerDown.moved = true;
    }
  });

  renderer.domElement.addEventListener('pointerleave', function () {
    pointerOnCanvas = false;
  });

  renderer.domElement.addEventListener('pointerenter', function () {
    pointerOnCanvas = true;
  });

  renderer.domElement.addEventListener('pointerdown', function (e) {
    pointerDown.x = e.clientX;
    pointerDown.y = e.clientY;
    pointerDown.time = performance.now();
    pointerDown.button = e.button;
    pointerDown.moved = false;
  });

  renderer.domElement.addEventListener('pointerup', function (e) {
    if (e.button !== 0) { pointerDown.time = 0; return; }
    var dt = performance.now() - pointerDown.time;
    var dx = e.clientX - pointerDown.x;
    var dy = e.clientY - pointerDown.y;
    var isClick = !pointerDown.moved && (dx * dx + dy * dy) < 36 && dt < 700;
    pointerDown.time = 0;
    if (!isClick) return;

    // Клик мимо аквариума (по тумбе или фону) игнорируем
    if (screenToSurfacePoint(e.clientX, e.clientY, surfaceHit)) {
      dropFood(surfaceHit.x, surfaceHit.z);
    }
  });

  // Кнопка «Покормить рыб» — бросает корм в случайное место
  document.getElementById('feed').addEventListener('click', function () {
    var fx = rand(-HALF_W * 0.55, HALF_W * 0.55);
    var fz = rand(-HALF_D * 0.5, HALF_D * 0.5);
    dropFood(fx, fz);
  });

  /* ------------------------------------------------------------
     Переключатель освещения
     ------------------------------------------------------------ */
  var modeButtons = document.querySelectorAll('.seg__btn');
  Array.prototype.forEach.call(modeButtons, function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.getAttribute('data-mode');
      setLightMode(mode);
      Array.prototype.forEach.call(modeButtons, function (b) {
        var active = b === btn;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    });
  });

  /* ------------------------------------------------------------
     Слайдеры
     ------------------------------------------------------------ */
  function paintRange(input) {
    var min = parseFloat(input.min), max = parseFloat(input.max);
    var val = parseFloat(input.value);
    var pct = ((val - min) / (max - min)) * 100;
    input.style.setProperty('--fill', pct + '%');
  }

  var fishRangeEl = document.getElementById('fishRange');
  var speedRangeEl = document.getElementById('speedRange');
  var fishValEl = document.getElementById('fishVal');
  var speedValEl = document.getElementById('speedVal');

  var speedScale = 1.0;

  fishRangeEl.value = fishCount;
  paintRange(fishRangeEl);
  paintRange(speedRangeEl);

  fishRangeEl.addEventListener('input', function () {
    var v = parseInt(fishRangeEl.value, 10);
    fishValEl.textContent = v;
    paintRange(fishRangeEl);
    setFishCount(v);
  });

  speedRangeEl.addEventListener('input', function () {
    speedScale = parseFloat(speedRangeEl.value);
    speedValEl.textContent = speedScale.toFixed(1) + '×';
    paintRange(speedRangeEl);
  });

  /* ------------------------------------------------------------
     Клавиатурные сокращения
     ------------------------------------------------------------ */
  window.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) {
      if (e.key !== ' ') return;
    }
    var k = e.key.toLowerCase();
    if (k === 'f') {
      document.getElementById('feed').click();
    } else if (k === '1') {
      modeButtons[0].click();
    } else if (k === '2') {
      modeButtons[1].click();
    } else if (k === '3') {
      modeButtons[2].click();
    }
  });

  /* ------------------------------------------------------------
     Изменение размера окна
     ------------------------------------------------------------ */
  function onResize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(w, h, false);
    planktonUniforms.uPixelRatio.value = renderer.getPixelRatio();
    bioUniforms.uPixelRatio.value = renderer.getPixelRatio();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () {
    setTimeout(onResize, 220);
  });

  /* ------------------------------------------------------------
     Обновление частиц
     ------------------------------------------------------------ */
  function updateParticles(dt, simTime) {
    // пузырьки
    var arr = bubbleGeo.attributes.position.array;
    for (var i = 0; i < bubbleCount; i++) {
      var b = bubbleData[i];
      var idx = i * 3;
      arr[idx + 1] += b.speed * dt;
      arr[idx] += Math.sin(simTime * 1.9 + b.phase) * b.drift * dt * 2.2;
      arr[idx + 2] += Math.cos(simTime * 1.5 + b.phase * 1.3) * b.drift * dt * 2.0;

      if (arr[idx + 1] > WATER_Y - 0.05) {
        arr[idx + 1] = rand(0.15, 0.6);
        arr[idx] = aerator.x + rand(-0.5, 0.5);
        arr[idx + 2] = aerator.z + rand(-0.35, 0.35);
      }
      arr[idx] = clamp(arr[idx], -HALF_W + 0.3, HALF_W - 0.3);
      arr[idx + 2] = clamp(arr[idx + 2], -HALF_D + 0.3, HALF_D - 0.3);
    }
    bubbleGeo.attributes.position.needsUpdate = true;
    bubbleMat.opacity = 0.55 + lightState.bio * 0.25;
  }

  function updateRipples(dt) {
    for (var i = 0; i < ripples.length; i++) {
      var r = ripples[i];
      if (!r.mesh.visible) continue;
      if (r.delay > 0) { r.delay -= dt; continue; }
      r.t += dt * 0.85;
      if (r.t >= 1) {
        r.mesh.visible = false;
        r.mesh.material.opacity = 0;
        continue;
      }
      var s = 0.5 + r.t * 5.2;
      r.mesh.scale.setScalar(s);
      r.mesh.material.opacity = (1 - r.t) * 0.4;
    }
  }

  /* ------------------------------------------------------------
     Главный цикл
     ------------------------------------------------------------ */
  var clock = new THREE.Clock();
  var elapsed = 0;
  var simAccumulator = 0;
  var SIM_STEP = 1 / 60;

  var fpsEl = document.getElementById('statFps');
  var fpsFrames = 0;
  var fpsTimer = 0;

  var lastFrameTime = performance.now();
  var frameCount = 0;

  function animate() {
    requestAnimationFrame(animate);

    var dtRaw = Math.min(clock.getDelta(), 0.05);
    var dt = dtRaw * speedScale;
    elapsed += dt;

    // Обновляем указатель раз в кадр — так реакция рыбы остаётся плавной
    updatePointerFromRay();

    // Физика с фиксированным шагом: стабильно при любом FPS
    simAccumulator += dt;
    var steps = 0;
    while (simAccumulator >= SIM_STEP && steps < 4) {
      updateBoids(SIM_STEP, elapsed);
      simAccumulator -= SIM_STEP;
      steps++;
    }
    if (steps === 4) simAccumulator = 0;

    assignFoodTargets(dt);
    updateFlakes(dt, elapsed);
    updateFishVisuals(dt, elapsed);
    updateParticles(dt, elapsed);
    updateRipples(dt);
    updateLights(dtRaw);

    // время в шейдерах
    waterUniforms.uTime.value = elapsed;
    plantTime.value = elapsed;
    planktonUniforms.uTime.value = elapsed;
    bioUniforms.uTime.value = elapsed;
    for (var ci2 = 0; ci2 < causticMaterials.length; ci2++) {
      causticMaterials[ci2].uTime.value = elapsed;
      causticMaterials[ci2].uCausticStrength.value =
        causticMaterials[ci2].baseStrength * (1 - lightState.bio * 0.55);
    }

    // лампа над аквариумом слегка покачивается
    tankLamp.position.x = Math.sin(elapsed * 0.21) * 6.5;
    tankLamp.position.z = 1.5 + Math.cos(elapsed * 0.17) * 3.5;

    controls.update();
    renderer.render(scene, camera);

    // счётчик FPS
    fpsFrames++;
    fpsTimer += dtRaw;
    if (fpsTimer >= 0.5) {
      fpsEl.textContent = Math.round(fpsFrames / fpsTimer) + ' fps';
      fpsFrames = 0;
      fpsTimer = 0;
    }
  }

  /* ------------------------------------------------------------
     Первый кадр: компилируем шейдеры и убираем экран загрузки
     ------------------------------------------------------------ */
  function reveal() {
    renderer.compile(scene, camera);
    animate();
    canvas.classList.add('is-ready');
    document.getElementById('boot').classList.add('is-gone');
    document.getElementById('hud').classList.add('is-ready');
    document.getElementById('hints').classList.add('is-ready');
    document.getElementById('readout').classList.add('is-ready');

    // плавный «влёт» камеры
    if (!reduceMotion) {
      var camFrom = camera.position.clone().multiplyScalar(1.34);
      var camTo = camera.position.clone();
      camera.position.copy(camFrom);
      controls.enabled = false;
      var t0 = performance.now();
      var DUR = 1900;
      (function fly() {
        var t = Math.min(1, (performance.now() - t0) / DUR);
        var e = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camFrom, camTo, e);
        controls.update();
        if (t < 1) {
          requestAnimationFrame(fly);
        } else {
          controls.enabled = true;
        }
      })();
    }
  }

  // Даем браузеру отрисовать экран загрузки перед тяжёлым стартом
  setTimeout(reveal, 60);

  /* Небольшой отладочный интерфейс: из консоли браузера можно
     посмотреть состояние сцены или досыпать корм вручную. */
  window.aquarium = {
    scene: scene,
    camera: camera,
    renderer: renderer,
    fishes: fishes,
    flakes: flakes,
    lightState: lightState,
    speciesAssets: speciesAssets,
    sun: sun,
    dropFood: dropFood,
    setFishCount: setFishCount,
    setLightMode: setLightMode,
    get activeFish() { return activeFish; }
  };

  /* Сообщаем, что сцена готова */
  window.__aquariumReady = true;
};

</script>
</body>
