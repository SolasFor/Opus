<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import*as T from 'three';
import{OrbitControls}from 'three/addons/controls/OrbitControls.js';
import{mergeGeometries}from 'three/addons/utils/BufferGeometryUtils.js';

const TW=12,TH=6.4,TD=6,WT=6.0,rnd=(a,b)=>a+Math.random()*(b-a),UP=new T.Vector3(0,1,0);
const R=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);
R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.15;document.body.appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x02080c);S.fog=new T.FogExp2(0x0b4f68,.026);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);C.position.set(0,3.8,15.5);
const O=new OrbitControls(C,R.domElement);
Object.assign(O,{enableDamping:true,dampingFactor:.05,minDistance:7,maxDistance:22,minPolarAngle:1.15,maxPolarAngle:1.72,minAzimuthAngle:-1.1,maxAzimuthAngle:1.1,enablePan:false,autoRotate:true,autoRotateSpeed:.25});
O.target.set(0,2.9,0);
let idle,ar=.25,busy=false;O.addEventListener('start',()=>{busy=true;clearTimeout(idle)});
O.addEventListener('end',()=>{idle=setTimeout(()=>busy=false,6000)});

const uT={value:0},uPx={value:1},uN={value:0},uW={value:0},uCur={value:.4},uF={value:0},uAir={value:1},uR={value:Array.from({length:6},()=>new T.Vector3(0,0,-100))};
function resize(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);uPx.value=innerHeight*R.getPixelRatio()/(2*Math.tan(C.fov*Math.PI/360))}
addEventListener('resize',resize);resize();

/* material patching (caustics, sway, fish swimming) */
function patch(m,key,vh,vb,fh,fb){m.customProgramCacheKey=()=>key;
 m.onBeforeCompile=s=>{s.uniforms.uT=uT;s.uniforms.uCur=uCur;
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform float uT,uCur;\n'+vh).replace('#include <begin_vertex>','#include <begin_vertex>\n'+vb);
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform float uT,uCur;\n'+fh).replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n'+fb)};return m}
const CF=`varying vec3 vWP;float caus(vec2 p){float t=uT*.55;vec2 q=p;float a=0.;for(int i=0;i<3;i++){q+=vec2(sin(q.y*1.3+t),cos(q.x*1.1-t*1.2))*.55;a+=1.-abs(sin(q.x*1.8)+sin(q.y*1.8))*.5;}a/=3.;return pow(clamp(a,0.,1.),4.);}`;
const caus=m=>patch(m,'caus','varying vec3 vWP;','vWP=(modelMatrix*vec4(transformed,1.)).xyz;',CF,'totalEmissiveRadiance+=vec3(.5,.85,1.)*caus(vWP.xz)*1.5*clamp(1.-vWP.y/6.,0.,1.)*(.25+diffuseColor.rgb);');

/* tank: water volume, glass, cabinet, hood */
const water=new T.Mesh(new T.BoxGeometry(TW,WT,TD),new T.ShaderMaterial({side:T.BackSide,uniforms:{uT,uN,uW},
 vertexShader:`varying vec3 vP;void main(){vP=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vP,1.);}`,
 fragmentShader:`uniform float uT,uN,uW;varying vec3 vP;void main(){float h=clamp(vP.y/6.,0.,1.);vec3 c=mix(vec3(0.,.025,.05),vec3(.01,.2,.3),pow(h,.8));c+=vec3(0.,.06,.05)*pow(h,3.);float g=exp(-pow((vP.x+sin(uT*.1)*2.)*.16,2.))*h*.2;c+=vec3(.08,.25,.3)*g;c+=vec3(.3,.1,0.)*uW*pow(h,2.5);c*=1.-uN*.8;gl_FragColor=vec4(c,1.);
#include <tonemapping_fragment>
#include <colorspace_fragment>
}`}));
water.position.y=WT/2;S.add(water);
const glass=new T.Mesh(new T.BoxGeometry(TW+.05,TH,TD+.05),new T.ShaderMaterial({transparent:true,depthWrite:false,side:T.DoubleSide,blending:T.AdditiveBlending,
 vertexShader:`varying vec3 vN,vV;void main(){vec4 w=modelMatrix*vec4(position,1.);vN=normalize(mat3(modelMatrix)*normal);vV=cameraPosition-w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`varying vec3 vN,vV;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),3.);gl_FragColor=vec4(vec3(.5,.85,1.)*f*.35,f*.4);}`}));
glass.position.y=TH/2;glass.renderOrder=10;S.add(glass);
const dark=new T.MeshStandardMaterial({color:0x07090c,roughness:.4,metalness:.6});
const bx=(w,h,d,x,y,z,m)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);S.add(o);return o};
bx(TW+.3,.2,TD+.3,0,-.1,0,dark);
bx(TW+.8,3.2,TD+.8,0,-1.8,0,new T.MeshStandardMaterial({color:0x1a1210,roughness:.55}));
bx(TW+.3,.9,TD+.3,0,TH+.45,0,dark);
bx(TW-1,.06,.02,0,TH+.12,TD/2+.17,new T.MeshBasicMaterial({color:0xcff6ff,fog:false}));

/* lights */
const hemi=new T.HemisphereLight(0x6fd6ff,0x082030,1.3);S.add(hemi);
const sun=new T.DirectionalLight(0xcff6ff,2.4);sun.position.set(-3,12,5);S.add(sun);
const rim=new T.PointLight(0x2f8cff,30,14);rim.position.set(4,1.2,-2);S.add(rim);

/* procedural textures */
const hs=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
function vn(x,y,p){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),h=(a,b)=>hs(((a%p)+p)%p,((b%p)+p)%p);return h(xi,yi)*(1-u)*(1-v)+h(xi+1,yi)*u*(1-v)+h(xi,yi+1)*(1-u)*v+h(xi+1,yi+1)*u*v}
const fbm=(x,y,p,o)=>{let s=0,a=.5;for(let i=0;i<o;i++){s+=a*vn(x*p,y*p,p);p*=2;a*=.5}return s};
function tex(fn,rx,ry){const w=256,c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d'),im=g.createImageData(w,w);
 for(let j=0;j<w;j++)for(let i=0;i<w;i++){const v=Math.max(0,Math.min(1,fn(i/w,j/w)))*255,o=(j*w+i)*4;im.data[o]=im.data[o+1]=im.data[o+2]=v;im.data[o+3]=255}
 g.putImageData(im,0,0);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=T.SRGBColorSpace;t.anisotropy=4;return t}
const ST=tex((x,y)=>.8+.35*(fbm(x,y,16,4)-.5)+.05*Math.sin((y+.08*fbm(x,y,4,3))*120)+(hs(x*999,y*777)-.5)*.12,6,3);
const RT=tex((x,y)=>.62+.5*fbm(x,y,4,5)+.12*(1-Math.abs(2*fbm(x+.3,y,6,3)-1)),2,2),RK=[];
/* ground */
const gn=(x,z)=>Math.sin(x*.9)*Math.cos(z*1.3)*.5+Math.sin(x*2.1+z*1.7)*.25+Math.sin(z*3.1-x*.7)*.12;
const groundY=(x,z)=>.28+gn(x,z)*.1+Math.max(0,-z+.3)*.2*(.7+.3*Math.sin(x*.6));
{const g=new T.PlaneGeometry(TW-.02,TD-.02,100,50);g.rotateX(-Math.PI/2);const p=g.attributes.position,c=new Float32Array(p.count*3);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,groundY(x,z));const k=.8+.25*gn(x,z)+Math.random()*.1;c.set([.62*k,.5*k,.32*k],i*3)}
 g.setAttribute('color',new T.BufferAttribute(c,3));g.computeVertexNormals();
 S.add(new T.Mesh(g,caus(new T.MeshStandardMaterial({vertexColors:true,roughness:.95,map:ST,bumpMap:ST,bumpScale:2.5}))));
 const pb=new T.InstancedMesh(new T.IcosahedronGeometry(1,0),new T.MeshStandardMaterial({roughness:.8}),120),M=new T.Matrix4(),q=new T.Quaternion(),e=new T.Euler();
 for(let i=0;i<120;i++){const x=rnd(-5.7,5.7),z=rnd(-2.8,2.8),s=rnd(.03,.09);e.set(rnd(0,6),rnd(0,6),0);M.compose(new T.Vector3(x,groundY(x,z)+s*.2,z),q.setFromEuler(e),new T.Vector3(s*1.4,s,s*1.2));pb.setMatrixAt(i,M);pb.setColorAt(i,new T.Color().setHSL(rnd(.05,.12),rnd(.1,.4),rnd(.2,.55)))}
 S.add(pb)}

/* rocks */
function rock(r,col,x,z,sy){const g=new T.IcosahedronGeometry(r,3),p=g.attributes.position,v=new T.Vector3(),sd=Math.random()*9;
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).normalize();const n=1+.22*Math.sin(v.x*3+sd)*Math.sin(v.y*2.6+sd*1.7)+.12*Math.sin(v.z*5+sd*.6);p.setXYZ(i,v.x*r*n,v.y*r*n*sy,v.z*r*n)}
 const m=new T.Mesh(g,caus(new T.MeshStandardMaterial({color:col,roughness:.95,flatShading:true,map:RT,bumpMap:RT,bumpScale:5})));m.position.set(x,groundY(x,z)+r*sy*.3,z);m.rotation.y=sd;S.add(m);RK.push({p:m.position,r:r*.9})}
[[1.0,0x4a4a50,-4.3,-1.2,.8],[.7,0x56524c,-3.3,-.4,.9],[.55,0x3d4348,-4.9,-.1,.7],[.9,0x4d4a46,4.0,-1.3,.8],[.6,0x5a5650,4.8,-.5,.9],[.5,0x3f464c,1.2,-2.1,.7],[.4,0x4d4a46,-1.0,1.4,.6]].forEach(a=>rock(a[0],a[1],a[2],a[3],a[4]));

/* coral */
function coral(x,z,col,s){const g=new T.Group(),m=new T.MeshStandardMaterial({color:col,roughness:.7,emissive:col,emissiveIntensity:.22,bumpMap:RT,bumpScale:6});
 (function br(p,d,len,r,n){const e=p.clone().addScaledVector(d,len),c=new T.Mesh(new T.CylinderGeometry(r*.7,r,len,6),m);c.position.copy(p).add(e).multiplyScalar(.5);c.quaternion.setFromUnitVectors(UP,d);g.add(c);
  if(n>0)for(let i=0,k=2+(Math.random()<.4?1:0);i<k;i++){const nd=d.clone().add(new T.Vector3(rnd(-.55,.55),0,rnd(-.55,.55))).normalize();nd.y=Math.max(nd.y,.4);nd.normalize();br(e,nd,len*.74,r*.7,n-1)}})(new T.Vector3(),UP,.5,.1,3);
 g.position.set(x,groundY(x,z)-.05,z);g.scale.setScalar(s);S.add(g)}
[[-1.6,-1,0xff4f8b,1.1],[2.1,-1.4,0xff8a3d,1.3],[-2.8,.4,0xb36bff,.8],[.3,-.6,0xff6f61,.9],[3.3,.3,0x35d6c4,.8]].forEach(a=>coral(a[0],a[1],a[2],a[3]));

/* kelp */
{const N=75,g=new T.PlaneGeometry(.08,1,1,12);g.translate(0,.5,0);const p=g.attributes.position;
 for(let i=0;i<p.count;i++)p.setX(i,p.getX(i)*(1-.85*p.getY(i)));
 const m=patch(new T.MeshStandardMaterial({roughness:.55,side:T.DoubleSide}),'kelp','varying float vH;',
 'vH=position.y;vec4 o=instanceMatrix*vec4(0.,0.,0.,1.);float ph=o.x*1.7+o.z*2.3;float k=pow(position.y,1.6);transformed.x+=(sin(uT*1.1+ph+position.y*3.)*.07+uCur*(.14+.08*sin(uT*.4+o.z)))*k;transformed.z+=cos(uT*.8+ph*1.3+position.y*2.)*(.04+uCur*.05)*k;',
 'varying float vH;','totalEmissiveRadiance+=vec3(.03,.16,.04)*vH*vH;');
 const k=new T.InstancedMesh(g,m,N),M=new T.Matrix4(),q=new T.Quaternion();
 for(let i=0;i<N;i++){const x=rnd(-5.6,5.6),z=rnd(-2.8,.2),s=rnd(1.4,4.6);M.compose(new T.Vector3(x,groundY(x,z)-.05,z),q.setFromAxisAngle(UP,rnd(0,6.28)),new T.Vector3(s,s,s));k.setMatrixAt(i,M);k.setColorAt(i,new T.Color().setHSL(rnd(.22,.38),.65,rnd(.16,.3)))}
 S.add(k)}

/* god rays + surface */
const rayM=new T.ShaderMaterial({transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,uniforms:{uT,uN,uW},
 vertexShader:`varying vec2 vU;varying float vS;void main(){vU=uv;vS=modelMatrix[3].x*3.1;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform float uT,uN,uW;varying vec2 vU;varying float vS;void main(){float e=pow(smoothstep(0.,.5,vU.x)*smoothstep(1.,.5,vU.x),1.5);float f=pow(vU.y,1.3);float fl=.6+.4*sin(uT*.6+vS)*sin(uT*.37+vS*2.);gl_FragColor=vec4(mix(vec3(.45,.8,.9),vec3(1.,.6,.3),uW)*e*f*fl*.22*(1.-uN*.9),1.);}`});
const rays=[];for(let i=0;i<8;i++){const r=new T.Mesh(new T.PlaneGeometry(rnd(1,2.2),6.2),rayM);r.position.set(-5+i*1.4+rnd(-.3,.3),WT-3.1,rnd(-1.5,1.5));r.rotation.y=rnd(-.5,.5);r.userData.p=rnd(0,6);S.add(r);rays.push(r)}
const surf=new T.Mesh(new T.PlaneGeometry(TW,TD,100,50),new T.ShaderMaterial({transparent:true,depthWrite:false,side:T.DoubleSide,uniforms:{uT,uR},
 vertexShader:`uniform float uT;uniform vec3 uR[6];varying float vH;void main(){vec3 p=position;float h=sin(p.x*1.6+uT*1.2)*.02+sin(p.y*2.3-uT*1.5)*.02;for(int i=0;i<6;i++){float a=uT-uR[i].z;float r=length(vec2(p.x,-p.y)-uR[i].xy);h+=sin(r*9.-a*8.)*exp(-a*.9-r*.35)*.05*step(r,a*2.4);}p.z+=h;vH=h;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
 fragmentShader:`varying float vH;void main(){float s=smoothstep(.02,.04,vH);gl_FragColor=vec4(vec3(.12,.35,.45)+s*.6,.3+s*.4);}`}));
surf.rotation.x=-Math.PI/2;surf.position.y=WT;S.add(surf);

/* bubbles + plankton */
function mkPts(n,vs,fs,fn){const g=new T.BufferGeometry(),p=new Float32Array(n*3),a=new Float32Array(n*4);
 for(let i=0;i<n;i++){const r=fn(i);p.set(r.slice(0,3),i*3);a.set(r.slice(3),i*4)}
 g.setAttribute('position',new T.BufferAttribute(p,3));g.setAttribute('aS',new T.BufferAttribute(a,4));
 const m=new T.Points(g,new T.ShaderMaterial({uniforms:{uT,uPx,uCur,uF,uAir,uN},vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));m.frustumCulled=false;S.add(m)}
const BV=`uniform float uT,uPx,uCur,uF,uAir;attribute vec4 aS;varying float vA;void main(){float t=fract(uT*aS.x+aS.y);vec3 p=position;p.y=.4+t*5.5;p.x+=sin(t*20.+aS.y*30.)*.08*aS.w+uCur*t*t*1.5;p.z+=cos(t*17.+aS.y*20.)*.08*aS.w;vec4 mv=viewMatrix*vec4(p,1.);gl_PointSize=aS.z*uPx/-mv.z*(.6+.6*t);vA=smoothstep(0.,.05,t)*(1.-smoothstep(.93,1.,t))*uAir;gl_Position=projectionMatrix*mv;}`;
const BF=`varying float vA;void main(){vec2 c=gl_PointCoord-.5;float r=length(c)*2.;if(r>1.)discard;float ring=smoothstep(.55,.95,r)*(1.-smoothstep(.95,1.,r));float hl=smoothstep(.3,0.,length(c-vec2(-.18,-.2)))*.9;gl_FragColor=vec4(vec3(.8,.95,1.),(ring*.7+hl+.05)*vA);}`;
mkPts(70,BV,BF,()=>[-4.7+rnd(-.05,.05),0,-1.6+rnd(-.05,.05),rnd(.12,.3),Math.random(),rnd(.07,.16),.3]);
mkPts(30,BV,BF,()=>[rnd(-5.5,5.5),0,rnd(-2.6,2.6),rnd(.04,.09),Math.random(),rnd(.04,.09),1]);
mkPts(320,`uniform float uT,uPx,uCur,uF,uAir;attribute vec4 aS;varying float vA;void main(){vec3 p=position;p.x=mod(p.x+5.4+uF*.35,10.8)-5.4;p.x+=sin(uT*.15+aS.x*40.)*.4;p.y+=sin(uT*.11+aS.y*40.)*.6;p.z+=cos(uT*.13+aS.z*40.)*.5;vec4 mv=viewMatrix*vec4(p,1.);gl_PointSize=aS.w*uPx/-mv.z;vA=.25+.75*(.5+.5*sin(uT*.6+aS.x*60.));gl_Position=projectionMatrix*mv;}`,
 `uniform float uN;varying float vA;void main(){float a=smoothstep(1.,0.,length(gl_PointCoord-.5)*2.);gl_FragColor=vec4(mix(vec3(.6,.9,1.),vec3(.2,1.,.9),uN),a*a*vA*(.6+uN*1.4));}`,
 ()=>[rnd(-5.7,5.7),rnd(.5,5.8),rnd(-2.8,2.8),Math.random(),Math.random(),Math.random(),rnd(.015,.04)]);

/* fish */
const ENV=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'#bfefff');gr.addColorStop(.45,'#2a7f95');gr.addColorStop(1,'#04141a');g.fillStyle=gr;g.fillRect(0,0,256,128);const rg=g.createRadialGradient(70,20,0,70,20,60);rg.addColorStop(0,'rgba(255,250,230,.95)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,256,128);const t=new T.CanvasTexture(c);t.mapping=T.EquirectangularReflectionMapping;t.colorSpace=T.SRGBColorSpace;const pm=new T.PMREMGenerator(R),e=pm.fromEquirectangular(t).texture;pm.dispose();t.dispose();return e})();
function fishGeo(o){
 const mk=(g,p)=>{const P=g.attributes.position,c=new Float32Array(P.count*3);for(let i=0;i<P.count;i++)c.set(o.c(P.getX(i),P.getY(i)/o.H,P.getZ(i),p),i*3);g.setAttribute('color',new T.BufferAttribute(c,3));return g};
 const b=new T.SphereGeometry(1,36,22);b.deleteAttribute('uv');const P=b.attributes.position;
